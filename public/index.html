<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PawPass — Sổ hộ chiếu thú cưng</title>
<meta name="description" content="PawPass — quản lý hồ sơ, sức khỏe, tiêm phòng và giấy tờ của thú cưng.">
<link rel="icon" href="/assets/0aac20424488808bb687fe0bf895c0a7.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;family=Patrick+Hand&amp;display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app"></div>
<noscript>PawPass cần bật JavaScript để hoạt động.</noscript>

<!-- UI template carried over from the approved Step 1 prototype (rendered by js/runtime.js). -->
<template id="pp-template">
<div class="pp">

<sc-if value="{{busy}}" hint-placeholder-val="{{ false }}"><div class="bar" role="progressbar" aria-label="Đang tải"></div></sc-if>
<div class="scroller">

<!-- ================= AUTH ================= -->
<sc-if value="{{scr.auth}}" hint-placeholder-val="{{ true }}">
<div class="auth">
  <section class="auth-copy">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="width:46px;height:46px;border-radius:16px;background:#F2A541;border:2.5px solid #3A2E28;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #3A2E28">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#3A2E28" aria-hidden="true"><ellipse cx="5.5" cy="10" rx="2.2" ry="2.8"></ellipse><ellipse cx="9.5" cy="5.5" rx="2.2" ry="2.8"></ellipse><ellipse cx="14.5" cy="5.5" rx="2.2" ry="2.8"></ellipse><ellipse cx="18.5" cy="10" rx="2.2" ry="2.8"></ellipse><path d="M12 11c-3 0-6.2 3.6-6.2 6.3 0 1.8 1.4 2.9 3 2.9 1.3 0 2.1-.6 3.2-.6s1.9.6 3.2.6c1.6 0 3-1.1 3-2.9C18.2 14.6 15 11 12 11z"></path></svg>
      </span>
      <span class="brand" style="font-size:28px;font-weight:800">PawPass</span>
    </div>
    <div>
      <p class="hand greet" style="font-size:26px">xin chào, người nuôi thú cưng!</p>
      <h1 class="h1" style="font-size:clamp(32px,4.2vw,44px);margin-top:4px">Mỗi bé có một cuốn sổ riêng.</h1>
    </div>
    <div class="stickers">
      <div class="stk stk-1">
        <div class="stk-art" aria-hidden="true">
          <img class="stkcat" src="/assets/0aac20424488808bb687fe0bf895c0a7.png" alt="" width="58" height="42" style="width:58px;height:auto">
          <span class="bars"><i style="width:90%"></i><i style="width:70%"></i><i style="width:80%"></i></span>
        </div>
        <span class="stk-cap">Hồ sơ từng bé</span>
        <span class="stk-sub">Ảnh, loài, giống, cân nặng</span>
      </div>
      <div class="stk stk-2">
        <div class="stk-art" aria-hidden="true"><span class="minist"><span>ĐÃ TIÊM</span><span style="font-size:13px">Mũi 2</span></span></div>
        <span class="stk-cap">Khám &amp; tiêm chủng</span>
        <span class="stk-sub">Mỗi mũi là một con dấu</span>
      </div>
      <div class="stk stk-3">
        <div class="stk-art" aria-hidden="true" style="background:#fff">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="#3A2E28"><ellipse cx="5.5" cy="10" rx="2.2" ry="2.8"></ellipse><ellipse cx="9.5" cy="5.5" rx="2.2" ry="2.8"></ellipse><ellipse cx="14.5" cy="5.5" rx="2.2" ry="2.8"></ellipse><ellipse cx="18.5" cy="10" rx="2.2" ry="2.8"></ellipse><path d="M12 11c-3 0-6.2 3.6-6.2 6.3 0 1.8 1.4 2.9 3 2.9 1.3 0 2.1-.6 3.2-.6s1.9.6 3.2.6c1.6 0 3-1.1 3-2.9C18.2 14.6 15 11 12 11z"></path></svg>
          <span class="tag t-pink">PDF</span>
        </div>
        <span class="stk-cap">Giấy tờ</span>
        <span class="stk-sub">JPG, PNG, PDF — tìm lại trong vài giây</span>
      </div>
    </div>
    <div class="welcome hide-sm" aria-hidden="true"><img class="wdog" src="/assets/32a20f51c5b0015abaaeb38b6cb7d81e.png" alt=""><span class="rig wavecat"><img class="rp rp-tail" src="/assets/4a42cfb3bb6bc9f052f88649768da6cd.png" alt=""><img class="rp rp-body" src="/assets/007cdd15ec302769ce9a82fa462e75e7.png" alt=""><img class="rp rp-legL" src="/assets/8475cc7b850252a4518883a6b1425683.png" alt=""><img class="rp rp-legR" src="/assets/cbb2c2516681a093d8c332b015c77ec6.png" alt=""><img class="rp rp-arm" src="/assets/6bf23b2723dce08abf9942318fb082b4.png" alt=""></span>
      <svg width="250" height="104" viewBox="0 0 250 104">
        <g stroke="#3A2E28" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 100 H242" fill="none"></path>
        </g>
      </svg>
    </div>
  </section>

  <div class="cover-wrap">
    <div class="peek peek-imgs" aria-hidden="true"><img src="/assets/0aac20424488808bb687fe0bf895c0a7.png" alt="" width="186" height="136"><img src="/assets/340faf1d5e7b89f669fc952729e58a6d.png" alt="" width="186" height="136"></div>
    <section class="cover">
      <div class="cover-in">
        <div class="cover-title">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#3A2E28" aria-hidden="true"><ellipse cx="5.5" cy="10" rx="2.2" ry="2.8"></ellipse><ellipse cx="9.5" cy="5.5" rx="2.2" ry="2.8"></ellipse><ellipse cx="14.5" cy="5.5" rx="2.2" ry="2.8"></ellipse><ellipse cx="18.5" cy="10" rx="2.2" ry="2.8"></ellipse><path d="M12 11c-3 0-6.2 3.6-6.2 6.3 0 1.8 1.4 2.9 3 2.9 1.3 0 2.1-.6 3.2-.6s1.9.6 3.2.6c1.6 0 3-1.1 3-2.9C18.2 14.6 15 11 12 11z"></path></svg>
          <b>Hộ chiếu thú cưng</b>
        </div>
        <div class="page">
    <sc-if value="{{scr.login}}" hint-placeholder-val="{{ true }}">
    <div>
      <h2 class="h1" style="font-size:28px">Đăng nhập</h2>
      <p class="muted" style="margin:4px 0 0">Mở lại sổ của các bé.</p>
    </div>
    <div onKeyDown="{{H.keyLogin}}" style="display:flex;flex-direction:column;gap:16px">
      <sc-if value="{{formError}}" hint-placeholder-val="{{ false }}"><div role="alert" class="tag t-red" style="height:auto;padding:10px 14px;border-radius:14px;font-size:14px;white-space:normal">{{formError}}</div></sc-if>
      <div>
        <label class="lbl" for="lg-email">Email <span class="req">*</span></label>
        <input id="lg-email" class="{{cls.email}}" type="text" inputmode="email" autocomplete="email" value="{{f.email}}" onChange="{{H.on.email}}" placeholder="ban@email.com">
        <sc-if value="{{err.email}}" hint-placeholder-val="{{ false }}"><p class="err">{{err.email}}</p></sc-if>
      </div>
      <div>
        <label class="lbl" for="lg-pass">Mật khẩu <span class="req">*</span></label>
        <input id="lg-pass" class="{{cls.password}}" type="password" autocomplete="current-password" value="{{f.password}}" onChange="{{H.on.password}}">
        <sc-if value="{{err.password}}" hint-placeholder-val="{{ false }}"><p class="err">{{err.password}}</p></sc-if>
      </div>
      <button type="button" class="btn btn-p" disabled="{{saving}}" style="width:100%" onClick="{{H.submitLogin}}">{{loginLabel}}</button>
    </div>
    <p style="margin:0;font-size:14px;text-align:center" class="muted">Chưa có tài khoản? <button type="button" class="plain" onClick="{{H.goRegister}}" style="color:#A85A14;font-weight:800;min-height:0;text-decoration:underline">Đăng ký ngay</button></p>
    </sc-if>

    <sc-if value="{{scr.register}}" hint-placeholder-val="{{ false }}">
    <div>
      <h2 class="h1" style="font-size:28px">Tạo tài khoản</h2>
      <p class="muted" style="margin:4px 0 0">Bắt đầu sổ hộ chiếu cho các bé.</p>
    </div>
    <div onKeyDown="{{H.keyRegister}}" style="display:flex;flex-direction:column;gap:16px">
      <sc-if value="{{formError}}" hint-placeholder-val="{{ false }}"><div role="alert" class="tag t-red" style="height:auto;padding:10px 14px;border-radius:14px;font-size:14px;white-space:normal">{{formError}}</div></sc-if>
      <div>
        <label class="lbl" for="rg-name">Họ và tên <span class="req">*</span></label>
        <input id="rg-name" class="{{cls.name}}" type="text" autocomplete="name" value="{{f.name}}" onChange="{{H.on.name}}">
        <sc-if value="{{err.name}}" hint-placeholder-val="{{ false }}"><p class="err">{{err.name}}</p></sc-if>
      </div>
      <div>
        <label class="lbl" for="rg-email">Email <span class="req">*</span></label>
        <input id="rg-email" class="{{cls.email}}" type="text" inputmode="email" autocomplete="email" value="{{f.email}}" onChange="{{H.on.email}}">
        <sc-if value="{{err.email}}" hint-placeholder-val="{{ false }}"><p class="err">{{err.email}}</p></sc-if>
      </div>
      <div>
        <label class="lbl" for="rg-pass">Mật khẩu <span class="req">*</span></label>
        <input id="rg-pass" class="{{cls.password}}" type="password" autocomplete="new-password" value="{{f.password}}" onChange="{{H.on.password}}">
        <sc-if value="{{err.password}}" hint-placeholder-val="{{ false }}"><p class="err">{{err.password}}</p></sc-if>
        <sc-if value="{{noErr.password}}" hint-placeholder-val="{{ true }}"><p class="hint">Tối thiểu 6 ký tự.</p></sc-if>
      </div>
      <div>
        <label class="lbl" for="rg-confirm">Nhập lại mật khẩu <span class="req">*</span></label>
        <input id="rg-confirm" class="{{cls.confirm}}" type="password" autocomplete="new-password" value="{{f.confirm}}" onChange="{{H.on.confirm}}">
        <sc-if value="{{err.confirm}}" hint-placeholder-val="{{ false }}"><p class="err">{{err.confirm}}</p></sc-if>
      </div>
      <button type="button" class="btn btn-p" disabled="{{saving}}" style="width:100%" onClick="{{H.submitRegister}}">{{registerLabel}}</button>
    </div>
    <p style="margin:0;font-size:14px;text-align:center" class="muted">Đã có tài khoản? <button type="button" class="plain" onClick="{{H.goLogin}}" style="color:#A85A14;font-weight:800;min-height:0;text-decoration:underline">Đăng nhập</button></p>
    </sc-if>
        </div>
      </div>
    </section>
  </div>
</div>
</sc-if>

<!-- ================= APP ================= -->
<sc-if value="{{scr.app}}" hint-placeholder-val="{{ false }}">
<div class="game">
<header class="topbar">
  <div class="topbar-in">
    <div class="logo">
      <span style="width:40px;height:40px;border-radius:14px;background:#FFFCF5;border:2.5px solid #3A2E28;display:inline-flex;align-items:center;justify-content:center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#3A2E28" aria-hidden="true"><ellipse cx="5.5" cy="10" rx="2.2" ry="2.8"></ellipse><ellipse cx="9.5" cy="5.5" rx="2.2" ry="2.8"></ellipse><ellipse cx="14.5" cy="5.5" rx="2.2" ry="2.8"></ellipse><ellipse cx="18.5" cy="10" rx="2.2" ry="2.8"></ellipse><path d="M12 11c-3 0-6.2 3.6-6.2 6.3 0 1.8 1.4 2.9 3 2.9 1.3 0 2.1-.6 3.2-.6s1.9.6 3.2.6c1.6 0 3-1.1 3-2.9C18.2 14.6 15 11 12 11z"></path></svg>
      </span>
      <span class="brand" style="font-size:24px;font-weight:800">PawPass</span>
    </div>
    <nav aria-label="Điều hướng chính" class="tnavs">
      <button type="button" class="{{nav.dashboard}}" onClick="{{H.navDash}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>Trang chủ</button>
      <button type="button" class="{{nav.pets}}" onClick="{{H.navPets}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="10" r="2"></circle><circle cx="10" cy="5.5" r="2"></circle><circle cx="14" cy="5.5" r="2"></circle><circle cx="18" cy="10" r="2"></circle><path d="M12 12c-3 0-5.5 3.3-5.5 5.6 0 1.5 1.2 2.4 2.6 2.4 1.2 0 1.8-.5 2.9-.5s1.7.5 2.9.5c1.4 0 2.6-.9 2.6-2.4 0-2.3-2.5-5.6-5.5-5.6z"></path></svg>Thú cưng</button>
      <button type="button" class="{{nav.search}}" onClick="{{H.navSearch}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Tìm kiếm</button>
      <button type="button" class="{{nav.account}}" onClick="{{H.navAccount}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg>Tài khoản</button>
    </nav>
    <div class="who">
      <sc-if value="{{meHasAvatar}}" hint-placeholder-val="{{ false }}"><img class="ava" src="{{me.avatar}}" alt="" style="width:38px;height:38px"></sc-if>
      <sc-if value="{{meNoAvatar}}" hint-placeholder-val="{{ true }}"><span class="ava" aria-hidden="true" style="width:38px;height:38px;font-size:14px;background:#FCE3E8">{{meInitials}}</span></sc-if>
      <span class="who-name" style="font-weight:800;font-size:14px;white-space:nowrap">{{me.name}}</span>
      <button type="button" class="btn btn-sm icon-btn" style="box-shadow:none" onClick="{{H.logout}}" aria-label="Đăng xuất" title="Đăng xuất"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H5v16h4"></path><path d="M14 8l4 4-4 4"></path><path d="M18 12H9"></path></svg></button>
    </div>
  </div>
</header>

<main class="main">

  <!-- ---------- TRANG CHỦ ---------- -->
  <sc-if value="{{pg.dashboard}}" hint-placeholder-val="{{ true }}">
  <div class="wrap">
    <div class="hud">
      <div class="hud-hello">
        <p class="hand greet">{{greeting}}</p>
        <h1 class="h1">Sổ hộ chiếu của các bé</h1>
      </div>
      <div class="hud-res" role="list" aria-label="Tổng số trong sổ">
        <div class="res" role="listitem"><span class="res-ico" style="background:#FFB347" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><ellipse cx="5.5" cy="10" rx="2.2" ry="2.8"></ellipse><ellipse cx="9.5" cy="5.5" rx="2.2" ry="2.8"></ellipse><ellipse cx="14.5" cy="5.5" rx="2.2" ry="2.8"></ellipse><ellipse cx="18.5" cy="10" rx="2.2" ry="2.8"></ellipse><path d="M12 11c-3 0-6.2 3.6-6.2 6.3 0 1.8 1.4 2.9 3 2.9 1.3 0 2.1-.6 3.2-.6s1.9.6 3.2.6c1.6 0 3-1.1 3-2.9C18.2 14.6 15 11 12 11z"></path></svg></span><b>{{tally.pets}}</b><span>bé</span></div>
        <div class="res" role="listitem"><span class="res-ico" style="background:#7BD389" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"></path></svg></span><b>{{tally.health}}</b><span>lần khám</span></div>
        <div class="res" role="listitem"><span class="res-ico" style="background:#7FB8F0" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 3l3 3M19.5 4.5L15 9M16 8l-9 9H4v-3l9-9z"></path></svg></span><b>{{tally.vacc}}</b><span>mũi tiêm</span></div>
        <div class="res" role="listitem"><span class="res-ico" style="background:#F59AB5" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h8l5 5v15H6z"></path></svg></span><b>{{tally.docs}}</b><span>tài liệu</span></div>
      </div>
    </div>

    <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
      <div class="card empty" role="status"><span class="hand" style="font-size:20px">Đang gọi các bé về…</span></div>
    </sc-if>

    <sc-if value="{{loaded}}" hint-placeholder-val="{{ true }}">
    <div class="home">
      <section class="plist" aria-labelledby="pp-mine">
        <div class="sec-head">
          <h2 id="pp-mine" class="h2">Các bé của bạn</h2>
          <p class="muted small">Bấm vào một cuốn sổ để xem chi tiết</p>
        </div>
        <sc-for list="{{pv}}" as="p" hint-placeholder-count="3">
          <button type="button" class="passport" onClick="{{p.open}}" aria-label="Mở sổ của {{p.name}}">
            <span class="pp-photo" style="background: {{p.bg}}">
              <sc-if value="{{p.hasPhoto}}" hint-placeholder-val="{{ false }}"><img class="face" src="{{p.photo}}" alt="" style="width:84px;height:84px"></sc-if>
              <sc-if value="{{p.hasIllus}}" hint-placeholder-val="{{ false }}"><img class="face illus" src="{{p.illus}}" alt="" style="width:84px;height:84px"></sc-if>
              <sc-if value="{{p.noPhoto}}" hint-placeholder-val="{{ true }}"><span class="face" aria-hidden="true" style="width:84px;height:84px;font-size:38px">{{p.initials}}</span></sc-if>
            </span>
            <span class="pp-body">
              <span style="display:flex;flex-direction:column">
                <span class="pp-name">{{p.name}}</span>
                <span class="muted" style="font-size:14px;font-weight:700">{{p.species}} · {{p.breedText}} · {{p.gender}}</span>
              </span>
              <span class="pp-fields">
                <span class="pp-f"><span>Tuổi</span><b>{{p.ageText}}</b></span>
                <span class="pp-f"><span>Cân nặng</span><b>{{p.weightText}}</b></span>
                <span class="pp-f"><span>Tiêm chủng</span><b>{{p.vaccSummary}}</b></span>
              </span>
              <span class="pp-foot"><span>Khám gần nhất: <b>{{p.lastExamShort}}</b></span><span>Tài liệu: <b>{{p.nDocs}}</b></span></span>
            </span>
          </button>
        </sc-for>
        <button type="button" class="add-tile" onClick="{{H.addPet}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Thêm một bé mới</button>
      </section>

      <div class="side-col">
      <aside class="notepad" aria-label="Cần để ý">
        <button type="button" class="sleeper" onClick="{{H.pokeSleeper}}" aria-label="Chú mèo đang ngủ — bấm để đánh thức">
          <sc-if value="{{sleeper.awake}}" hint-placeholder-val="{{ false }}"><span class="bubble" style="bottom:auto;top:-36px;left:30%">{{sleeper.line}}</span></sc-if>
          <sc-if value="{{sleeper.asleep}}" hint-placeholder-val="{{ true }}"><span class="rig sleep"><img class="rp rp-tail" src="/assets/6b3f5680d1a64004327195845871f724.png" alt=""><img class="rp rp-body" src="/assets/4c178692906419cbb35abc276342e455.png" alt=""><img class="rp rp-legL" src="/assets/7637ffa01a3ae55f01ee5103f60790e0.png" alt=""><img class="rp rp-legR" src="/assets/6917dd2c030c8bc14b7220cb1a34a85d.png" alt=""><img class="rp rp-arm" src="/assets/67184b3746ec4595ade560d393ececf6.png" alt=""></span></sc-if>
          <sc-if value="{{sleeper.awake}}" hint-placeholder-val="{{ false }}"><span class="rig sleep awake"><img class="rp rp-tail" src="/assets/6b3f5680d1a64004327195845871f724.png" alt=""><img class="rp rp-body" src="/assets/247084d3c08a6eef1fa33e13fe06be0e.png" alt=""><img class="rp rp-legL" src="/assets/7637ffa01a3ae55f01ee5103f60790e0.png" alt=""><img class="rp rp-legR" src="/assets/6917dd2c030c8bc14b7220cb1a34a85d.png" alt=""><img class="rp rp-arm" src="/assets/67184b3746ec4595ade560d393ececf6.png" alt=""></span></sc-if>
          <sc-if value="{{sleeper.asleep}}" hint-placeholder-val="{{ true }}"><span class="zz" aria-hidden="true" style="position:absolute;left:4px;top:-6px">z z</span></sc-if>
        </button>

        <div class="np-head">
          <span class="np-ico" style="background:#FCE3E0" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3A2E28" stroke-width="2.6" stroke-linecap="round"><path d="M12 7v6"></path><circle cx="12" cy="17" r="1.2" fill="#3A2E28"></circle><path d="M10.3 3.8L2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0z"></path></svg></span>

              <input class="inp s-inp" type="search" aria-label="Tìm lần khám" placeholder="Tìm lý do, chẩn đoán, thuốc…" value="{{tabQuery}}" onChange="{{H.onTabQuery}}">

    <div class="m-head">
      <div><span class="tag t-blue">Tiêm chủng · {{vv.code}}</span><h2 id="pp-vv" class="h2" style="margin-top:8px">{{vv.vaccine_name}}</h2><p class="muted small" style="margin:2px 0 0">{{vv.petName}}</p></div>
      <button type="button" class="btn icon-btn btn-flat" onClick="{{H.close}}" aria-label="Đóng"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <dl class="m-body kv">
      <div><dt>Ngày tiêm</dt><dd>{{vv.dateText}}</dd></div>
      <div><dt>Liều / mũi</dt><dd>{{vv.dose}}</dd></div>
      <div><dt>Ghi chú</dt><dd style="white-space:pre-line">{{vv.notesText}}</dd></div>
    </dl>
    <div class="m-foot">
      <button type="button" class="btn" onClick="{{H.close}}">Đóng</button>
      <button type="button" class="btn btn-p" onClick="{{H.editViewed}}">Chỉnh sửa</button>
    </div>
  </div>
</div>
</sc-if>

<sc-if value="{{md.viewDoc}}" hint-placeholder-val="{{ false }}">
<div class="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pp-vd">
    <div class="m-head">
      <div style="min-width:0"><span class="tag t-orange">Tài liệu · {{vd.code}}</span><h2 id="pp-vd" class="h2" style="margin-top:8px;overflow-wrap:anywhere">{{vd.file_name}}</h2><p class="muted small" style="margin:2px 0 0">{{vd.petName}} · {{vd.typeLabel}} · Tải lên {{vd.dateText}}</p></div>
      <button type="button" class="btn icon-btn btn-flat" onClick="{{H.close}}" aria-label="Đóng"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div class="m-body" style="display:flex;flex-direction:column;gap:14px">
      <sc-if value="{{vd.showImg}}" hint-placeholder-val="{{ false }}"><img src="{{vd.url}}" alt="{{vd.file_name}}" style="width:100%;max-height:420px;object-fit:contain;border-radius:16px;border:2px solid #3A2E28;background:#FBF1DF"></sc-if>
      <sc-if value="{{vd.isPdf}}" hint-placeholder-val="{{ false }}">
        <div style="border-radius:16px;border:2px solid #3A2E28;background:#FCE3E0;padding:28px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="#FFFCF5" stroke="#3A2E28" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6v18h12V7z"></path><path d="M14 3v4h4"></path></svg>
          <span style="font-weight:800">Tài liệu PDF</span>
          <sc-if value="{{vd.hasUrl}}" hint-placeholder-val="{{ false }}"><a href="{{vd.url}}" target="_blank" rel="noopener" style="font-weight:800">Mở trong tab mới</a></sc-if>
        </div>
      </sc-if>
      <dl class="kv">
        <div><dt>Mô tả</dt><dd style="font-size:15px">{{vd.descText}}</dd></div>
        <div><dt>Đường dẫn lưu trữ</dt><dd style="font-family:ui-monospace,monospace;font-size:12px;overflow-wrap:anywhere">{{vd.file_path}}</dd></div>
      </dl>
    </div>
    <div class="m-foot">
      <button type="button" class="btn" onClick="{{H.close}}">Đóng</button>
      <sc-if value="{{vd.hasUrl}}" hint-placeholder-val="{{ false }}"><a class="btn btn-p" href="{{vd.url}}" download="{{vd.file_name}}">Tải xuống</a></sc-if>
    </div>
  </div>
</div>
</sc-if>

<sc-if value="{{md.confirm}}" hint-placeholder-val="{{ false }}">
<div class="overlay">
  <div class="modal modal-sm" role="alertdialog" aria-modal="true" aria-labelledby="pp-cf" aria-describedby="pp-cfd">
    <div class="m-body" style="display:flex;flex-direction:column;gap:10px;padding-top:24px">
      <h2 id="pp-cf" class="h2">{{confirm.title}}</h2>
      <p id="pp-cfd" style="margin:0" class="muted">{{confirm.text}}</p>
    </div>
    <div class="m-foot">
      <button type="button" class="btn" onClick="{{H.close}}">Hủy</button>
      <button type="button" class="btn btn-dd" disabled="{{saving}}" onClick="{{H.confirmYes}}">{{deleteLabel}}</button>
    </div>
  </div>
</div>
</sc-if>

<sc-if value="{{arriving}}" hint-placeholder-val="{{ false }}">
<div class="arrive" role="status" aria-live="polite">
  <div class="scene" aria-hidden="true">
    <svg class="house" width="170" height="150" viewBox="0 0 170 150">
      <g stroke="#3A2E28" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <rect x="22" y="62" width="126" height="86" rx="6" fill="#FFFCF5"></rect>
        <path d="M8 70 L85 10 L162 70 Z" fill="#F2A541"></path>
        <rect x="64" y="92" width="42" height="56" rx="21" fill="#E58E2E"></rect>
        <circle cx="98" cy="122" r="2.5" fill="#3A2E28" stroke="none"></circle>
        <rect x="32" y="84" width="22" height="22" rx="4" fill="#D9E8F5"></rect>
        <rect x="116" y="84" width="22" height="22" rx="4" fill="#D9E8F5"></rect>
        <rect x="66" y="40" width="38" height="18" rx="6" fill="#FFFCF5"></rect>
        <path d="M85 54 c-3 -4 -8 -4 -8 -8 c0 -3 4 -4 8 -1 c4 -3 8 -2 8 1 c0 4 -5 4 -8 8 z" fill="#F7B9C6" stroke-width="2"></path>
      </g>
    </svg>
    <svg class="heart" style="right:14%;bottom:150px;animation-delay:3.2s" width="26" height="24" viewBox="0 0 26 24"><path d="M13 22 C5 16 2 12 2 8 C2 4 5 2 8 2 C10 2 12 3 13 5 C14 3 16 2 18 2 C21 2 24 4 24 8 C24 12 21 16 13 22 Z" fill="#F7B9C6" stroke="#3A2E28" stroke-width="2.5"></path></svg>
    <svg class="heart" style="right:22%;bottom:162px;animation-delay:3.6s" width="20" height="18" viewBox="0 0 26 24"><path d="M13 22 C5 16 2 12 2 8 C2 4 5 2 8 2 C10 2 12 3 13 5 C14 3 16 2 18 2 C21 2 24 4 24 8 C24 12 21 16 13 22 Z" fill="#F2A541" stroke="#3A2E28" stroke-width="2.5"></path></svg>

    <div class="runner r1">
      <span class="dust"></span><span class="dust d2"></span>
      <span class="scat dog srun"><span class="scat-in"><img class="sp sp-bl" src="/assets/34fa3d20ab2aa593842d4e04628cad77.png" alt="" style="transform-origin:54.9% 86%"><img class="sp sp-br" src="/assets/4890f9c7d48ee81f0cf7f4d0101c0163.png" alt="" style="transform-origin:86.9% 77.9%"><img class="sp sp-body" src="/assets/826390a4d66f344ab40fb7fdff1f8ed8.png" alt=""><img class="sp sp-tail" src="/assets/9460c06c24eca96ba20097365bf18a88.png" alt="" style="transform-origin:73.9% 39.5%"><img class="sp sp-fl" src="/assets/6dc9808652c526353df9fed7334e0ac7.png" alt="" style="transform-origin:17.3% 80.4%"><img class="sp sp-fr" src="/assets/913ee90e22a722c92645bfe8487085fc.png" alt="" style="transform-origin:38.2% 82.4%"></span></span>
    </div>
    <div class="runner r2">
      <span class="dust"></span><span class="dust d2"></span>
      <span class="scat srun"><span class="scat-in"><img class="sp sp-tail" src="/assets/2b765f6182a8f9779d8e2f721ce60e8c.png" alt=""><img class="sp sp-bl" src="/assets/35108e65bac65cac88e507578534e3a9.png" alt=""><img class="sp sp-br" src="/assets/36144e5453ac09019df75b0489a7615c.png" alt=""><img class="sp sp-body" src="/assets/fb5c707c4ae34315adb329d14fe2585a.png" alt=""><img class="sp sp-fl" src="/assets/55c94157a4759198cf9851efc3385f07.png" alt=""><img class="sp sp-fr" src="/assets/d70af102f81c72a61744c02001f84388.png" alt=""></span></span>
    </div>
    <div class="runner r3">
      <span class="dust"></span><span class="dust d2"></span>
      <span class="scat srun w2"><span class="scat-in"><img class="sp sp-tail" src="/assets/d4c81f3a4aba59053039dca6b2ecdab4.png" alt=""><img class="sp sp-bl" src="/assets/5848697b833807dc325b875b8f77831c.png" alt=""><img class="sp sp-br" src="/assets/48c6bf6e0a12cd2daa0ed1da59cc0fa6.png" alt=""><img class="sp sp-body" src="/assets/4cc8defb276558ab2d6e062e0a58e639.png" alt=""><img class="sp sp-fl" src="/assets/6cb33b1f24cfc63793f8f9fbc8d7506e.png" alt=""><img class="sp sp-fr" src="/assets/2db580be475513ccf5bd33233866eff4.png" alt=""></span></span>
    </div>
  </div>
  <h2 class="h1" style="font-size:clamp(28px,4vw,38px)">Đang gọi các bé về<span class="dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></h2>
  <p class="hand muted" style="margin:-12px 0 0;font-size:21px">mở sổ hộ chiếu, kiểm tra mũi tiêm, xếp lại giấy tờ</p>
  <div class="prog" aria-hidden="true"><span></span></div>
  <button type="button" class="btn btn-sm btn-flat" onClick="{{H.skipArrive}}">Bỏ qua</button>
</div>
</sc-if>

<div class="toasts" aria-live="polite">
  <sc-for list="{{toasts}}" as="t" hint-placeholder-count="0"><div class="{{t.cls}}">{{t.text}}</div></sc-for>
</div>

<!-- ================= THE YARD: walking pets (decor, clickable) ================= -->
<sc-if value="{{showYard}}" hint-placeholder-val="{{ true }}">
<div class="{{yardCls}}">
  <div class="ground" aria-hidden="true"></div>

  <div class="mover m1">
    <sc-if value="{{bub.c1}}" hint-placeholder-val="{{ false }}"><span class="bubble">{{bub.c1}}</span></sc-if>
    <div class="flipper">
      <button type="button" class="{{critCls.c1}}" onClick="{{H.pokeC1}}" aria-label="Mèo cam đi dạo — bấm để chơi">
        <span class="scat"><span class="scat-in"><img class="sp sp-tail" src="/assets/9c6bceea5f948e98e6f6ab7d2240a5c5.png" alt=""><img class="sp sp-bl" src="/assets/863c361c635a7688366ab440dd2ffa83.png" alt=""><img class="sp sp-br" src="/assets/bcccc5e2ecc6f10d3e8ed4a033a5ad26.png" alt=""><img class="sp sp-body" src="/assets/542182c7eebbaec2c91cb125824045ce.png" alt=""><img class="sp sp-fl" src="/assets/c3c65f77a6bb45b7cc35519b5a75a1f2.png" alt=""><img class="sp sp-fr" src="/assets/8f07238589138869dce7786e0f258776.png" alt=""></span></span>
      </button>
    </div>
  </div>

  <div class="mover m2">
    <sc-if value="{{bub.c2}}" hint-placeholder-val="{{ false }}"><span class="bubble">{{bub.c2}}</span></sc-if>
    <div class="flipper">
      <button type="button" class="{{critCls.c2}}" onClick="{{H.pokeC2}}" aria-label="Mèo mun đi dạo — bấm để chơi">
        <span class="scat w2"><span class="scat-in"><img class="sp sp-tail" src="/assets/d4c81f3a4aba59053039dca6b2ecdab4.png" alt=""><img class="sp sp-bl" src="/assets/5848697b833807dc325b875b8f77831c.png" alt=""><img class="sp sp-br" src="/assets/48c6bf6e0a12cd2daa0ed1da59cc0fa6.png" alt=""><img class="sp sp-body" src="/assets/4cc8defb276558ab2d6e062e0a58e639.png" alt=""><img class="sp sp-fl" src="/assets/6cb33b1f24cfc63793f8f9fbc8d7506e.png" alt=""><img class="sp sp-fr" src="/assets/2db580be475513ccf5bd33233866eff4.png" alt=""></span></span>
      </button>
    </div>
  </div>

  <div class="mover m3">
    <sc-if value="{{bub.d1}}" hint-placeholder-val="{{ false }}"><span class="bubble">{{bub.d1}}</span></sc-if>
    <div class="flipper">
      <button type="button" class="{{critCls.d1}}" onClick="{{H.pokeD1}}" aria-label="Cún con đi dạo — bấm để chơi">
        <span class="scat dog"><span class="scat-in"><img class="sp sp-bl" src="/assets/34fa3d20ab2aa593842d4e04628cad77.png" alt="" style="transform-origin:54.9% 86%"><img class="sp sp-br" src="/assets/4890f9c7d48ee81f0cf7f4d0101c0163.png" alt="" style="transform-origin:86.9% 77.9%"><img class="sp sp-body" src="/assets/826390a4d66f344ab40fb7fdff1f8ed8.png" alt=""><img class="sp sp-tail" src="/assets/9460c06c24eca96ba20097365bf18a88.png" alt="" style="transform-origin:73.9% 39.5%"><img class="sp sp-fl" src="/assets/6dc9808652c526353df9fed7334e0ac7.png" alt="" style="transform-origin:17.3% 80.4%"><img class="sp sp-fr" src="/assets/913ee90e22a722c92645bfe8487085fc.png" alt="" style="transform-origin:38.2% 82.4%"></span></span>
      </button>
    </div>
  </div>
</div>
</sc-if>


</div>
</template>

<script src="/js/validators.js"></script>
<script src="/js/runtime.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
